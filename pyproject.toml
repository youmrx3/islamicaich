[project]
name = "thabat"
version = "1.0.0"
description = "Thabat — verify hadith and Quran quotes in forwarded messages before sharing them."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "numpy==2.3.5",
    "rapidfuzz==3.14.6",
    "pydantic==2.12.4",
    "anthropic==1.8.0",
    "httpx",
]

[tool.vercel]
entrypoint = "index:app"
